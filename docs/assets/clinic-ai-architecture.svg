<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="KLM AI Clinic Assistant system architecture diagram">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A1830"/>
      <stop offset="1" stop-color="#0F3D55"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14B8A6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="url(#hdr)"/>
  <text x="600" y="38" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#F1F5F9" text-anchor="middle">System Architecture</text>
  <text x="600" y="60" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">KLM AI Clinic Assistant - end-to-end data and control flow</text>

  <!-- ============ Channel boxes (col 1) ============ -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="30" y="110" width="180" height="54" rx="10" fill="#0E2A4E" stroke="#38BDF8"/>
    <text x="120" y="132" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Patient Web Portal</text>
    <text x="120" y="150" font-size="11" fill="#7FA3C0" text-anchor="middle">Next.js on Vercel</text>

    <rect x="30" y="184" width="180" height="54" rx="10" fill="#0E2A4E" stroke="#38BDF8"/>
    <text x="120" y="206" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">WhatsApp</text>
    <text x="120" y="224" font-size="11" fill="#7FA3C0" text-anchor="middle">Twilio webhook</text>

    <rect x="30" y="258" width="180" height="54" rx="10" fill="#0E2A4E" stroke="#38BDF8"/>
    <text x="120" y="280" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Email</text>
    <text x="120" y="298" font-size="11" fill="#7FA3C0" text-anchor="middle">Gmail IMAP + API</text>
  </g>

  <!-- ============ FastAPI box (col 2) ============ -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="250" y="110" width="200" height="202" rx="12" fill="#0B3B54" stroke="#14B8A6"/>
    <text x="350" y="140" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">FastAPI Backend</text>
    <text x="350" y="160" font-size="11" fill="#7FD8C8" text-anchor="middle">Python 3.11 - hosted on Render</text>
    <g font-size="12" fill="#B8D4E3">
      <text x="270" y="190">- REST API (/api/v1)</text>
      <text x="270" y="212">- WebSocket /ws</text>
      <text x="270" y="234">- Twilio webhook endpoint</text>
      <text x="270" y="256">- Gmail IMAP poll (15 s)</text>
      <text x="270" y="278">- APScheduler background jobs</text>
    </g>
  </g>

  <!-- ============ LangGraph box (col 3) ============ -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="490" y="110" width="200" height="202" rx="12" fill="#1E293B" stroke="#A78BFA"/>
    <text x="590" y="140" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">LangGraph Workflow</text>
    <text x="590" y="160" font-size="11" fill="#C4B5FD" text-anchor="middle">multi-agent orchestration</text>
    <g font-size="12" fill="#D6CFF5">
      <text x="510" y="190">- Intent classification</text>
      <text x="510" y="212">- Specialist agents</text>
      <text x="510" y="234">- Safety validation layer</text>
      <text x="510" y="256">- Escalation routing</text>
    </g>
    <rect x="515" y="272" width="150" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.6"/>
    <text x="590" y="290" font-size="11.5" fill="#DDD6FE" text-anchor="middle">Groq - Llama 3.3 70B</text>
  </g>

  <!-- ============ Supabase box (col 4) ============ -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="730" y="110" width="200" height="202" rx="12" fill="#0F3A2E" stroke="#34D399"/>
    <text x="830" y="140" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">Supabase</text>
    <text x="830" y="160" font-size="11" fill="#86E3B8" text-anchor="middle">PostgreSQL - Auth - Realtime</text>
    <g font-size="12" fill="#C2E8D3">
      <text x="750" y="190">- Row Level Security</text>
      <text x="750" y="212">- Auth (JWT via GoTrue)</text>
      <text x="750" y="234">- Realtime publication</text>
      <text x="750" y="256">- Service-role admin access</text>
    </g>
  </g>

  <!-- ============ Dashboard box (col 5) ============ -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="970" y="110" width="200" height="202" rx="12" fill="#0E2A4E" stroke="#60A5FA"/>
    <text x="1070" y="140" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="middle">Receptionist Dashboard</text>
    <text x="1070" y="160" font-size="11" fill="#93C5FD" text-anchor="middle">Next.js on Vercel</text>
    <g font-size="12" fill="#C7DAEE">
      <text x="990" y="190">- Conversations + takeover</text>
      <text x="990" y="212">- Appointment management</text>
      <text x="990" y="234">- Analytics + AI confidence</text>
      <text x="990" y="256">- Escalations and alerts</text>
    </g>
  </g>

  <!-- ============ Arrows ============ -->
  <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="137" x2="248" y2="190"/>
    <line x1="210" y1="211" x2="248" y2="211"/>
    <line x1="210" y1="285" x2="248" y2="235"/>
    <line x1="450" y1="211" x2="488" y2="211"/>
    <line x1="690" y1="211" x2="728" y2="211"/>
  </g>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94A3B8">
    <text x="470" y="200" text-anchor="middle">process</text>
    <text x="710" y="200" text-anchor="middle">persist</text>
  </g>

  <!-- Realtime push: Supabase -> Dashboard -->
  <polyline points="830,110 830,80 1070,80 1070,108" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowTeal)"/>
  <text x="950" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2DD4BF" text-anchor="middle">Supabase Realtime - live updates</text>

  <!-- Escalation path: LangGraph -> Dashboard -->
  <polyline points="610,312 610,345 1070,345 1070,314" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowAmber)"/>
  <text x="840" y="338" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#FBBF24" text-anchor="middle">emergency / low-confidence escalation alerts</text>

  <!-- Staff actions: Dashboard -> FastAPI -->
  <polyline points="1030,312 1030,370 350,370 350,314" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="690" y="363" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">staff actions - human takeover - messages (Bearer JWT)</text>

  <!-- ============ Notes band ============ -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="30" y="420" width="360" height="64" rx="10" fill="#0F2440" stroke="#334155"/>
    <text x="50" y="446" font-size="13" font-weight="600" fill="#E2E8F0">Inbound</text>
    <text x="50" y="468" font-size="12" fill="#94A3B8">WhatsApp webhook - Gmail IMAP poll (15 s) - Web chat</text>

    <rect x="420" y="420" width="360" height="64" rx="10" fill="#0F2440" stroke="#334155"/>
    <text x="440" y="446" font-size="13" font-weight="600" fill="#E2E8F0">Outbound</text>
    <text x="440" y="468" font-size="12" fill="#94A3B8">Gmail API (OAuth2) replies - AI responses - reminders</text>

    <rect x="810" y="420" width="360" height="64" rx="10" fill="#0F2440" stroke="#334155"/>
    <text x="830" y="446" font-size="13" font-weight="600" fill="#E2E8F0">Public demo mode</text>
    <text x="830" y="468" font-size="12" fill="#94A3B8">Isolated sample data - writes blocked with HTTP 403</text>
  </g>

  <!-- ============ Legend ============ -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5">
    <line x1="30" y1="530" x2="70" y2="530" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="80" y="534" fill="#94A3B8">HTTP / data flow</text>
    <line x1="220" y1="530" x2="260" y2="530" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowTeal)"/>
    <text x="270" y="534" fill="#94A3B8">realtime / async</text>
    <line x1="420" y1="530" x2="460" y2="530" stroke="#F59E0B" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowAmber)"/>
    <text x="470" y="534" fill="#94A3B8">escalation path</text>
    <text x="1170" y="534" fill="#475569" text-anchor="end">Original diagram - not a product screenshot</text>
  </g>
</svg>
