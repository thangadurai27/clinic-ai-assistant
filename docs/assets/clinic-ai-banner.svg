<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="KLM AI Clinic Assistant project banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1830"/>
      <stop offset="0.55" stop-color="#0E2A4E"/>
      <stop offset="1" stop-color="#0F4C5C"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.85" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.08" cy="1" r="0.8">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glowTeal)"/>
  <rect width="1200" height="300" fill="url(#glowBlue)"/>

  <!-- Logo mark: medical cross -->
  <rect x="56" y="86" width="72" height="72" rx="18" fill="url(#logo)"/>
  <rect x="86" y="100" width="12" height="44" rx="3" fill="#F8FAFC"/>
  <rect x="72" y="114" width="44" height="12" rx="3" fill="#F8FAFC"/>

  <!-- Title + tagline -->
  <text x="152" y="122" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#F1F5F9">KLM AI Clinic Assistant</text>
  <text x="152" y="156" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#9FB6CC">AI-powered clinic operations platform - patient communication, appointment</text>
  <text x="152" y="178" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#9FB6CC">workflows and receptionist automation via multi-agent orchestration.</text>

  <!-- Tech chips -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">
    <rect x="152" y="208" width="92" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="198" y="227">Next.js 15</text>
    <rect x="254" y="208" width="82" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="295" y="227">FastAPI</text>
    <rect x="346" y="208" width="98" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="395" y="227">LangGraph</text>
    <rect x="454" y="208" width="90" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="499" y="227">Supabase</text>
    <rect x="554" y="208" width="120" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="614" y="227">Groq - Llama 3.3</text>
  </g>

  <!-- Decorative agent network -->
  <g stroke="#3B82F6" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="905" y1="70" x2="985" y2="52"/>
    <line x1="985" y1="52" x2="1058" y2="84"/>
    <line x1="1058" y1="84" x2="1090" y2="150"/>
    <line x1="1090" y1="150" x2="1010" y2="180"/>
    <line x1="1010" y1="180" x2="940" y2="140"/>
    <line x1="940" y1="140" x2="905" y2="70"/>
    <line x1="940" y1="140" x2="985" y2="52"/>
    <line x1="1010" y1="180" x2="1058" y2="84"/>
  </g>
  <g>
    <circle cx="905" cy="70" r="7" fill="#14B8A6" fill-opacity="0.9"/>
    <circle cx="985" cy="52" r="5" fill="#38BDF8" fill-opacity="0.85"/>
    <circle cx="1058" cy="84" r="8" fill="#2563EB" fill-opacity="0.9"/>
    <circle cx="1090" cy="150" r="5" fill="#14B8A6" fill-opacity="0.85"/>
    <circle cx="1010" cy="180" r="7" fill="#38BDF8" fill-opacity="0.9"/>
    <circle cx="940" cy="140" r="5" fill="#2563EB" fill-opacity="0.85"/>
  </g>

  <!-- Heartbeat line -->
  <polyline points="770,132 860,132 875,106 892,158 908,132 975,132" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>

  <!-- Chat bubble -->
  <rect x="980" y="215" width="140" height="54" rx="12" fill="#123A5E" stroke="#38BDF8" stroke-opacity="0.7"/>
  <polygon points="1008,269 1028,269 1000,290" fill="#123A5E" stroke="#38BDF8" stroke-opacity="0.7"/>
  <line x1="998" y1="235" x2="1102" y2="235" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <line x1="998" y1="252" x2="1072" y2="252" stroke="#64748B" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
