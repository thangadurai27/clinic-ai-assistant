<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="KLM AI Clinic Assistant LangGraph AI workflow diagram">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A1830"/>
      <stop offset="1" stop-color="#0F3D55"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
    </marker>
    <marker id="arrAmber2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#hdr2)"/>
  <text x="600" y="38" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#F1F5F9" text-anchor="middle">AI Workflow - LangGraph Orchestration</text>
  <text x="600" y="60" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Source: backend/app/graph/workflow.py</text>

  <!-- Step 1 -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <circle cx="256" cy="112" r="14" fill="#2563EB"/>
    <text x="256" y="117" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">1</text>
    <rect x="280" y="80" width="300" height="64" rx="10" fill="#0E2A4E" stroke="#38BDF8"/>
    <text x="430" y="106" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">Patient message received</text>
    <text x="430" y="126" font-size="11.5" fill="#7FA3C0" text-anchor="middle">POST /chat - Twilio webhook - Gmail IMAP poller</text>
  </g>
  <line x1="430" y1="144" x2="430" y2="174" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <circle cx="256" cy="208" r="14" fill="#2563EB"/>
    <text x="256" y="213" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">2</text>
    <rect x="280" y="176" width="300" height="64" rx="10" fill="#123B54" stroke="#2DD4BF"/>
    <text x="430" y="202" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">classify_intent</text>
    <text x="430" y="222" font-size="11.5" fill="#7FD8C8" text-anchor="middle">LLM intent label + confidence score</text>
  </g>
  <line x1="430" y1="240" x2="430" y2="270" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <circle cx="256" cy="304" r="14" fill="#2563EB"/>
    <text x="256" y="309" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">3</text>
    <rect x="280" y="272" width="300" height="64" rx="10" fill="#123B54" stroke="#2DD4BF"/>
    <text x="430" y="298" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">route_to_agent</text>
    <text x="430" y="318" font-size="11.5" fill="#7FD8C8" text-anchor="middle">conditional routing by classified intent</text>
  </g>

  <!-- Specialist agents group -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="790" y="96" width="350" height="374" rx="14" fill="#141F36" stroke="#A78BFA" stroke-dasharray="8 5"/>
    <text x="965" y="122" font-size="14" font-weight="700" fill="#DDD6FE" text-anchor="middle">Specialist agents (Groq - Llama 3.3 70B)</text>

    <rect x="810" y="140" width="310" height="48" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.7"/>
    <text x="965" y="162" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Appointment agent</text>
    <text x="965" y="179" font-size="11" fill="#A5B4CF" text-anchor="middle">book / reschedule / cancel</text>

    <rect x="810" y="208" width="310" height="48" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.7"/>
    <text x="965" y="230" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">FAQ agent</text>
    <text x="965" y="247" font-size="11" fill="#A5B4CF" text-anchor="middle">clinic info, hours, general queries</text>

    <rect x="810" y="276" width="310" height="48" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.7"/>
    <text x="965" y="298" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Triage agent</text>
    <text x="965" y="315" font-size="11" fill="#A5B4CF" text-anchor="middle">symptom assessment, emergency flags</text>

    <rect x="810" y="344" width="310" height="48" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.7"/>
    <text x="965" y="366" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Reminder agent</text>
    <text x="965" y="383" font-size="11" fill="#A5B4CF" text-anchor="middle">follow-ups and medication reminders</text>

    <rect x="810" y="412" width="310" height="48" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.8"/>
    <text x="965" y="434" font-size="13" font-weight="600" fill="#FDE68A" text-anchor="middle">Human support path</text>
    <text x="965" y="451" font-size="11" fill="#CDB27A" text-anchor="middle">treated as emergency escalation</text>
  </g>

  <line x1="580" y1="304" x2="788" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="790" y1="440" x2="582" y2="404" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <circle cx="256" cy="412" r="14" fill="#2563EB"/>
    <text x="256" y="417" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">4</text>
    <rect x="280" y="380" width="300" height="64" rx="10" fill="#123B54" stroke="#2DD4BF"/>
    <text x="430" y="406" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">validate_safety</text>
    <text x="430" y="426" font-size="11.5" fill="#7FD8C8" text-anchor="middle">safety rules + confidence threshold check</text>
  </g>
  <line x1="430" y1="444" x2="430" y2="503" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision diamond -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <circle cx="256" cy="560" r="14" fill="#2563EB"/>
    <text x="256" y="565" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">5</text>
    <polygon points="430,505 560,560 430,615 300,560" fill="#16304F" stroke="#38BDF8"/>
    <text x="430" y="556" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">Safe and confident?</text>
    <text x="430" y="576" font-size="11.5" fill="#7FA3C0" text-anchor="middle">confidence >= 0.6 and response passes safety</text>
  </g>

  <!-- Yes branch -->
  <polyline points="300,560 200,560 200,648" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="248" y="552" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#34D399">yes</text>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <circle cx="56" cy="682" r="14" fill="#059669"/>
    <text x="56" y="687" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">6</text>
    <rect x="80" y="650" width="300" height="64" rx="10" fill="#0F3A2E" stroke="#34D399"/>
    <text x="230" y="676" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">AI response returned</text>
    <text x="230" y="696" font-size="11.5" fill="#86E3B8" text-anchor="middle">reply stored - conversation state updated</text>
  </g>

  <!-- No branch -->
  <polyline points="560,560 700,560 700,648" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrAmber2)"/>
  <text x="590" y="552" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#FBBF24">no / emergency / low confidence</text>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <circle cx="556" cy="682" r="14" fill="#D97706"/>
    <text x="556" y="687" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">7</text>
    <rect x="580" y="650" width="330" height="64" rx="10" fill="#3B2F14" stroke="#F59E0B"/>
    <text x="745" y="676" font-size="15" font-weight="600" fill="#FDE68A" text-anchor="middle">Escalate to receptionist</text>
    <text x="745" y="696" font-size="11.5" fill="#E8C88A" text-anchor="middle">escalation summary - dashboard alert - human takeover</text>
  </g>

  <!-- Annotation chips -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <line x1="250" y1="208" x2="280" y2="208" stroke="#475569" stroke-width="1.5"/>
    <rect x="30" y="193" width="205" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#475569"/>
    <text x="132" y="212" font-size="11.5" fill="#94A3B8" text-anchor="middle">Groq - llama-3.3-70b-versatile</text>

    <line x1="262" y1="560" x2="300" y2="560" stroke="#475569" stroke-width="1.5"/>
    <rect x="30" y="545" width="225" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#475569"/>
    <text x="142" y="564" font-size="11.5" fill="#94A3B8" text-anchor="middle">CONFIDENCE_THRESHOLD = 0.6</text>

    <text x="1170" y="726" fill="#475569" font-size="11" text-anchor="end">Original diagram - not a product screenshot</text>
  </g>
</svg>
